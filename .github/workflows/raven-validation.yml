# Raven final validation on Linux (docs/experiments/raven-final-validation.md).
#
# Only for the experiment branch: builds the Raven prototype
# (sandbox/raven-evaluation, LPE_BUILD_RAVEN_EVALUATION=ON) with GCC in Debug
# and Release, then runs it on an X server without a GPU (Xvfb, Mesa's
# software OpenGL, llvmpipe): the self-test, the stress test, and the real
# input check (xdotool, xclip) at 100 % and at 150 % (Xft.dpi 144). This is
# not a GPU test: Linux on real graphics hardware is not covered here.
name: Raven validation

on:
  push:
    branches: [experiment/raven-final-validation]
  workflow_dispatch:

concurrency:
  group: raven-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LPE_WARNINGS_AS_ERRORS: "ON"
  PYTHON_VERSION: "3.13"

jobs:
  linux-raven:
    name: Linux GCC Raven (${{ matrix.config }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            build_type: Debug
          - config: release
            build_type: Release
    env:
      PRESET: linux-gcc-${{ matrix.config }}
      BUILD: build/raven-eval-${{ matrix.config }}
      LOGS: raven-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install developer tools (requirements-dev.txt)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install the X server and input tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xclip x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-linux-gcc-${{ matrix.config }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/linux-gcc', 'requirements-dev.txt') }}

      - name: Install dependencies (Conan)
        run: >-
          conan install . -pr:h=profiles/linux-gcc -pr:b=profiles/linux-gcc
          -s build_type=${{ matrix.build_type }} --lockfile=conan.lock --build=missing
          -c tools.system.package_manager:mode=install
          -c tools.system.package_manager:sudo=True
          -of "build/$PRESET/conan"

      - name: Fetch Raven at the pinned commit
        run: python sandbox/raven-evaluation/fetch_raven.py

      - name: Configure (prototype on)
        run: cmake --preset "$PRESET" -B "$BUILD" -DLPE_BUILD_RAVEN_EVALUATION=ON -DLPE_BUILD_TESTS=OFF

      - name: Build the prototype
        id: build
        run: cmake --build "$BUILD" --target raven-evaluation

      - name: Start the X server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$LOGS"
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in $(seq 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.1; done
          DISPLAY=:99 glxinfo -B | tee glxinfo.txt

      # Each check runs when the prototype was built, even if an earlier
      # check failed, so that one run reports all of them.
      - name: Self-test, stress test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          exe="$BUILD/bin/raven-evaluation"
          "$exe" --self-test 2>&1 | tee "$LOGS/self-test.log"
          "$exe" --self-test --with-imgui 2>&1 | tee "$LOGS/self-test-imgui.log"
          "$exe" --stress 3 2>&1 | tee "$LOGS/stress.log"
          grep -q "^\[summary\] PASS" "$LOGS/self-test.log"
          grep -q "^\[summary\] PASS" "$LOGS/self-test-imgui.log"
          grep -q "^\[stress\] PASS" "$LOGS/stress.log"

      - name: Real input at 100 %
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python sandbox/raven-evaluation/input_driver.py "$BUILD/bin/raven-evaluation" --with-imgui \
            --screenshot "$LOGS/x11-100.png" --log "$LOGS/input-100.log" | tee "$LOGS/input-100-summary.txt"

      - name: Real input at 150 % (Xft.dpi 144)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "Xft.dpi: 144" | xrdb -merge
          "$BUILD/bin/raven-evaluation" --self-test 2>&1 | tee "$LOGS/self-test-150.log"
          grep -q "^\[summary\] PASS" "$LOGS/self-test-150.log"
          python sandbox/raven-evaluation/input_driver.py "$BUILD/bin/raven-evaluation" --with-imgui \
            --screenshot "$LOGS/x11-150.png" --log "$LOGS/input-150.log" | tee "$LOGS/input-150-summary.txt"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raven-linux-${{ matrix.config }}
          path: |
            raven-logs/
            glxinfo.txt
          if-no-files-found: warn
