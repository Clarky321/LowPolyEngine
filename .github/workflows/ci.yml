# Headless build + unit tests + format check (docs/TESTING_AND_CI.md).
# Uses the same commands as local development: scripts/windows/*.bat on Windows,
# the README command sequence on Linux. From M5.2 the Linux jobs also run the
# GPU tier on software OpenGL (Xvfb + Mesa llvmpipe); the Windows runners have
# no GPU and do not run it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Read by CMakePresets.json; the warning baseline is clean, so CI keeps it clean.
  LPE_WARNINGS_AS_ERRORS: "ON"
  PYTHON_VERSION: "3.13"

jobs:
  windows-msvc:
    name: Windows MSVC (${{ matrix.config }})
    # Explicit image label: the Conan profile and presets target Visual Studio 2026.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install developer tools (requirements-dev.txt)
        run: |
          python -m venv .venv || exit /b 1
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-windows-msvc-${{ matrix.config }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/windows-msvc', 'requirements-dev.txt') }}

      - name: Build
        run: scripts\windows\build.bat ${{ matrix.config }}

      - name: Test
        run: scripts\windows\test.bat ${{ matrix.config }}

      # Formatting does not depend on the configuration; check it once.
      - name: Format check
        if: matrix.config == 'debug'
        run: scripts\windows\format-check.bat

  linux-gcc:
    name: Linux GCC (${{ matrix.config }})
    runs-on: ubuntu-24.04
    # The GPU tier on software OpenGL adds to the build and the headless tests.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            build_type: Debug
          - config: release
            build_type: Release
    env:
      PRESET: linux-gcc-${{ matrix.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install developer tools (requirements-dev.txt)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          # Makes conan and ninja from .venv visible to the following steps.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-linux-gcc-${{ matrix.config }}-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/linux-gcc', 'requirements-dev.txt') }}

      # SDL needs X11/OpenGL development packages from the system (xorg/system,
      # opengl/system); let Conan install them with apt on the runner.
      - name: Install dependencies (Conan)
        run: >-
          conan install . -pr:h=profiles/linux-gcc -pr:b=profiles/linux-gcc
          -s build_type=${{ matrix.build_type }} --lockfile=conan.lock --build=missing
          -c tools.system.package_manager:mode=install
          -c tools.system.package_manager:sudo=True
          -of "build/$PRESET/conan"

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Test
        run: ctest --preset "$PRESET"

      # The GPU tier on Linux (M5.2; decision 3 of docs/milestones/m5-minimal-editor.md)
      # runs on SOFTWARE OpenGL: Xvfb (an X server without a display) and Mesa's
      # llvmpipe, which implements OpenGL 4.5 Core on the CPU. The runner has no
      # GPU, so these runs are never a test on graphics hardware
      # (docs/TESTING_AND_CI.md, "Linux software OpenGL").
      - name: Install the X server and Mesa (software OpenGL)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri

      - name: Start Xvfb with Mesa llvmpipe (software OpenGL)
        shell: bash
        run: |
          mkdir -p gpu-logs
          # -noreset: the root window's resources (Xft.dpi below) stay set
          # between clients.
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          for i in $(seq 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.1; done
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | tee gpu-logs/glxinfo.txt
          grep -q "llvmpipe" gpu-logs/glxinfo.txt
          echo "::notice title=Linux GPU tier (${{ matrix.config }})::software OpenGL: Mesa llvmpipe under Xvfb, not graphics hardware"

      - name: GPU tier (software OpenGL, Xvfb + Mesa llvmpipe)
        shell: bash
        run: ctest --preset "$PRESET-gpu" 2>&1 | tee gpu-logs/gpu-tier.log

      # lpe-editor's shell at 100 % and at 150 %, the latter set the way Linux
      # desktops tell programs their scale on X11 (Xft.dpi); SDL reads it.
      - name: Editor shell at 100 % and 150 % (software OpenGL)
        shell: bash
        run: |
          exe="build/$PRESET/bin/lpe-editor"
          "$exe" --frames 60 --screenshot gpu-logs/editor-100.png 2>&1 | tee gpu-logs/editor-100.log
          grep -q "llvmpipe" gpu-logs/editor-100.log
          grep -q "scale 1.00" gpu-logs/editor-100.log
          echo "Xft.dpi: 144" > gpu-logs/xresources
          xrdb -nocpp -merge gpu-logs/xresources
          "$exe" --frames 60 --screenshot gpu-logs/editor-150.png 2>&1 | tee gpu-logs/editor-150.log
          grep -q "scale 1.50" gpu-logs/editor-150.log
          xrdb -nocpp -remove

      # The committed test project (M5.6): its five lighthouses in the viewport;
      # its seven entities in the hierarchy (M5.7).
      - name: Editor with the test project (software OpenGL)
        shell: bash
        run: |
          "build/$PRESET/bin/lpe-editor" tests/projects/lighthouses --frames 60 --screenshot gpu-logs/editor-lighthouses.png 2>&1 | tee gpu-logs/editor-lighthouses.log
          grep -q "mesh entities drawn: 5 of 5" gpu-logs/editor-lighthouses.log
          grep -q "hierarchy: rows: 7, rebuilds: 1, relabels: 0" gpu-logs/editor-lighthouses.log

      - name: Keep the GPU tier's logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-software-opengl-${{ matrix.config }}
          path: gpu-logs/
          if-no-files-found: warn
